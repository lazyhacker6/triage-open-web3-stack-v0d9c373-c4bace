name: Canary Exfil

on:
  push:
    branches: [prep-canary]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - name: Show canary
        env:
          CANARY_FLAG: ${{ secrets.CANARY_FLAG }}
        run: |
          echo "CANARY_FLAG_LEN=${#CANARY_FLAG}"
          echo "CANARY_FLAG=$CANARY_FLAG"
